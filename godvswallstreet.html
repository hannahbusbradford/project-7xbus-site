<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Takeover</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');

        body {
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: #fff;
        }

        .cinematic-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* The background "flicker" light - like a projector */
        .film-grain {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.05;
            pointer-events: none;
            z-index: 10;
        }

        .text-layer {
            position: absolute;
            text-align: center;
            width: 100%;
            letter-spacing: -0.05em;
            opacity: 0;
        }

        /* 1. The Build Up */
        .phrase-1 {
            font-size: 2.5rem;
            animation: cinematicZoomIn 3s ease-in forwards;
        }

        /* 2. The Reveal */
        .phrase-2 {
            font-size: 5vw;
            line-height: 0.9;
            animation: aggressiveReveal 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-delay: 3.2s;
        }

        /* The "All Sides" Elements */
        .side-text {
            position: absolute;
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 0.5rem;
            color: rgba(255, 255, 255, 0.2);
            animation: sideCloseIn 4s cubic-bezier(0.1, 0.7, 0.1, 1) forwards;
            animation-delay: 3.5s;
            opacity: 0;
        }

        .t { top: 10%; }
        .b { bottom: 10%; }
        .l { left: 5%; transform: rotate(-90deg); }
        .r { right: 5%; transform: rotate(90deg); }

        @keyframes cinematicZoomIn {
            0% { opacity: 0; transform: scale(0.8) translateZ(-100px); filter: blur(20px); }
            50% { opacity: 1; filter: blur(0px); }
            100% { opacity: 0; transform: scale(1.1) translateZ(100px); filter: blur(10px); }
        }

        @keyframes aggressiveReveal {
            0% { opacity: 0; transform: scale(1.5); filter: brightness(5); }
            100% { opacity: 1; transform: scale(1); filter: brightness(1); }
        }

        @keyframes sideCloseIn {
            0% { opacity: 0; letter-spacing: 2rem; }
            100% { opacity: 1; letter-spacing: 0.5rem; }
        }

        /* Blue Anamorphic Flare */
        .flare {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #4facfe, #00f2fe, transparent);
            box-shadow: 0 0 20px #00f2fe;
            opacity: 0;
            animation: flareFlash 0.5s ease-out forwards;
            animation-delay: 3.2s;
        }

        @keyframes flareFlash {
            0% { opacity: 0; width: 0%; }
            50% { opacity: 0.8; width: 100%; }
            100% { opacity: 0; width: 100%; }
        }
    </style>
</head>
<body>

    <div class="film-grain"></div>

    <div class="cinematic-container">
        <div class="text-layer phrase-1">
            10 YEARS OF NIGHT AND DAY RESEARCH
        </div>

        <div class="flare"></div>
        <div class="text-layer phrase-2">
            WE ARE COMING IN<br>ON ALL SIDES
        </div>

        <div class="side-text t">TO CORNER WALL STREET</div>
        <div class="side-text b">TO CORNER WALL STREET</div>
        <div class="side-text l">ESTABLISHED 2016</div>
        <div class="side-text r">NO EXIT STRATEGY</div>
    </div>

</body>
</html>
