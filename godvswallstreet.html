<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P7X | PREMIERE_SIGNAL</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            height: 100%; background-color: #000;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        .crt-container {
            position: relative;
            width: 100vw; height: 100vh;
            background: #050505;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            /* The SVG Filter makes the text actually "tear" based on noise */
            filter: url(#analog-damage) contrast(1.5) brightness(1.1);
        }

        .text-wrap {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 80%;
            /* Physical jitter of the entire tube */
            animation: tube-unstable 0.2s infinite;
        }

        h1 {
            font-family: "Arial Black", Gadget, sans-serif;
            font-size: clamp(2.5rem, 7vw, 6.5rem);
            color: #fff;
            margin: 0;
            line-height: 0.85;
            letter-spacing: -2px;
            text-transform: uppercase;
            /* Phosphor bleed */
            text-shadow: 0 0 15px rgba(255,255,255,0.4), 4px 0 0 rgba(255,0,0,0.4), -4px 0 0 rgba(0,255,255,0.4);
            animation: text-flicker 10s ease-in-out infinite;
        }

        p {
            font-family: "Arial Black", Gadget, sans-serif;
            font-size: clamp(1rem, 2.2vw, 2.5rem);
            color: rgba(255,255,255,0.7);
            letter-spacing: 12px;
            margin-top: 20px;
            text-transform: uppercase;
        }

        /* 70s OVERLAYS */
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 4px;
            z-index: 20; pointer-events: none;
        }

        .static-grain {
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="n"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23n)"/%3E%3C/svg%3E');
            opacity: 0.25;
            animation: noise-move 0.1s steps(2) infinite;
            z-index: 5; pointer-events: none;
        }

        /* PHYSICS ANIMATIONS */
        @keyframes text-flicker {
            0%, 100% { opacity: 0; filter: blur(20px); transform: scaleY(0.1); }
            5%, 90% { opacity: 1; filter: blur(0); transform: scaleY(1); }
            10%, 85% { opacity: 0.8; }
            12% { opacity: 1; }
        }

        @keyframes tube-unstable {
            0% { transform: translate(0,0); }
            50% { transform: translate(1px, -1px); }
            100% { transform: translate(-1px, 1px); }
        }

        @keyframes noise-move {
            0% { transform: translate(0,0); }
            100% { transform: translate(-2%, -1%); }
        }
    </style>
</head>
<body>

    <svg style="display:none;">
        <filter id="analog-damage">
            <feTurbulence type="fractalNoise" baseFrequency="0.01 0.4" numOctaves="2" result="noise">
                <animate attributeName="seed" values="0;100" dur="0.2s" repeatCount="indefinite"/>
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>

    <div class="static-grain"></div>
    <div class="scanlines"></div>

    <div class="crt-container">
        <div class="text-wrap">
            <h1>PROJECT7XBUS</h1>
            <p>AGAINST WALLSTREET</p>
        </div>
    </div>

</body>
</html>
