<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>70s Analog Project7xBUS</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* The physical TV glass container */
        .tv-screen {
            position: relative;
            width: 95vw;
            height: 95vh;
            max-width: 1200px;
            max-height: 800px;
            background: #1a1a1a;
            border-radius: 10% / 50%; /* Warped tube look */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 100px #000, 0 0 50px rgba(0,0,0,1);
            border: 20px solid #111;
        }

        /* High-contrast 70s Static Noise */
        .static-noise {
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 250 250" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="n"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23n)"/%3E%3C/svg%3E');
            opacity: 0.2;
            filter: grayscale(1) contrast(200%);
            animation: jitter 0.1s steps(2) infinite;
            z-index: 1;
        }

        /* The actual broadcast text */
        .text-container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 80%; /* Keeps text safe from the edges */
            color: #eee;
            font-family: "Arial Black", Gadget, sans-serif;
            text-transform: uppercase;
            /* Ghosting/Signal Bleed */
            text-shadow: 
                4px 0 2px rgba(255,0,0,0.2), 
                -4px 0 2px rgba(0,255,255,0.2),
                0 0 10px rgba(255,255,255,0.3);
            animation: signal-vibration 0.2s infinite;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 5rem);
            margin: 0;
            letter-spacing: -2px;
            line-height: 0.9;
        }

        p {
            font-size: clamp(0.8rem, 2vw, 1.8rem);
            letter-spacing: 5px;
            margin-top: 10px;
            opacity: 0.8;
        }

        /* Overlay: Scanlines & Screen Bulge */
        .overlays {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%),
                radial-gradient(circle, transparent 40%, rgba(0,0,0,0.7) 100%);
            background-size: 100% 4px, 100% 100%;
            z-index: 20;
            pointer-events: none;
        }

        /* Occasional signal "hit" */
        .signal-pop {
            position: absolute;
            width: 100%; height: 2px;
            background: rgba(255,255,255,0.2);
            top: 0;
            animation: pop 4s infinite;
            z-index: 15;
        }

        @keyframes jitter {
            0% { transform: translate(0,0); }
            100% { transform: translate(-1%, -1%); }
        }

        @keyframes signal-vibration {
            0% { transform: translate(0,0) scale(1); }
            50% { transform: translate(1px, -1px) scale(1.001); }
            100% { transform: translate(-1px, 0) scale(1); }
        }

        @keyframes pop {
            0% { top: -10%; }
            10% { top: 110%; }
            100% { top: 110%; }
        }
    </style>
</head>
<body>

    <div class="tv-screen">
        <div class="static-noise"></div>
        <div class="signal-pop"></div>
        <div class="overlays"></div>
        
        <div class="text-container">
            <h1>PROJECT7XBUS</h1>
            <p>AGAINST WALLSTREET</p>
        </div>
    </div>

</body>
</html>
