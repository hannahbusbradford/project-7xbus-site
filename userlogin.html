<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 7xBUS | System Entry</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #e5e7eb;
            --accent-color: #ffffff;
            --button-bg: #111827;
            --button-hover: #1f2937;
            --button-border: #374151;
            --success-color: #00ffcc;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 420px;
            padding: 2.5rem;
            background: linear-gradient(180deg, #0a0a0a 0%, #050505 100%);
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            color: var(--accent-color);
        }

        p {
            color: #888;
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .btn-google {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--accent-color);
            color: var(--bg-color);
            text-decoration: none;
            padding: 0.85rem 1.5rem;
            border-radius: 4px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            box-sizing: border-box;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.9rem;
        }

        .btn-google:hover {
            background-color: #e5e5e5;
            transform: translateY(-1px);
        }

        .btn-google:active {
            transform: translateY(1px);
        }

        .status-message {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            font-family: monospace;
            color: var(--success-color);
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Project 7xBUS</h1>
        <p>Authentication required for system entry. Sign in with your Google account to request initialization.</p>
        
        <button id="login-btn" class="btn-google">
            Initialize Google Auth
        </button>

        <div id="status" class="status-message"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA6BtSwFku_EoTKBJ7JebBIkvl_I1VYNQE",
            authDomain: "project7xbus.firebaseapp.com",
            projectId: "project7xbus",
            storageBucket: "project7xbus.firebasestorage.app",
            messagingSenderId: "827078709212",
            appId: "1:827078709212:web:f4340c6d029d2badd40919"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        const provider = new GoogleAuthProvider();

        const loginBtn = document.getElementById('login-btn');
        const statusDiv = document.getElementById('status');

        loginBtn.addEventListener('click', () => {
            statusDiv.style.color = '#888';
            statusDiv.innerText = "> Awaiting Google handshake...";
            statusDiv.style.display = 'block';

            signInWithPopup(auth, provider)
                .then((result) => {
                    const user = result.user;
                    
                    loginBtn.style.display = 'none';
                    statusDiv.style.color = 'var(--success-color)';
                    statusDiv.innerText = `> Access Granted. Welcome, ${user.displayName || user.email}.`;

                    // --- REDIRECT LOGIC ADDED HERE ---
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1500); 
                })
                .catch((error) => {
                    console.error("Auth Error:", error);
                    statusDiv.style.color = '#ff3333';
                    statusDiv.innerText = `> Error: ${error.message}`;
                });
        });
    </script>
</body>
</html>
