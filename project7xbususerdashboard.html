<!DOCTYPE HTML>
<html>
	<head>
		<title>Project 7xBUS | System Entry</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
        <style>
            /* Custom terminal styling for the Auth messages */
            .status-message {
                margin-top: 1.5rem;
                font-family: "Courier New", monospace;
                font-size: 0.9rem;
                font-weight: bold;
                color: #43d9b8; /* Paradigm Shift primary accent */
                display: none;
            }
        </style>
	</head>
	<body class="is-preload">

		<div id="wrapper">

				<section class="intro">
						<header>
							<h1>Project 7xBUS</h1>
							<p>Authentication required for system entry.<br/>Sign in with your Google account to request initialization.</p>
							<ul class="actions">
								<li><button id="login-btn" class="button primary large">Initialize Google Auth</button></li>
							</ul>
                            <div id="status" class="status-message"></div>
						</header>
						<div class="content">
                            <span class="image fill" data-position="center"><img src="images/image_1c02bc.jpg" alt="Gateway" /></span>
						</div>
					</section>

			</div>

		<script src="assets/js/jquery.min.js"></script>
			<script src="assets/js/jquery.scrolly.min.js"></script>
			<script src="assets/js/browser.min.js"></script>
			<script src="assets/js/breakpoints.min.js"></script>
			<script src="assets/js/util.js"></script>
			<script src="assets/js/main.js"></script>

        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
            import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

            const firebaseConfig = {
                apiKey: "AIzaSyA6BtSwFku_EoTKBJ7JebBIkvl_I1VYNQE",
                authDomain: "project7xbus.firebaseapp.com",
                projectId: "project7xbus",
                storageBucket: "project7xbus.firebasestorage.app",
                messagingSenderId: "827078709212",
                appId: "1:827078709212:web:f4340c6d029d2badd40919"
            };

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const provider = new GoogleAuthProvider();

            const loginBtn = document.getElementById('login-btn');
            const statusDiv = document.getElementById('status');

            loginBtn.addEventListener('click', () => {
                statusDiv.style.color = '#888';
                statusDiv.innerText = "> Awaiting Google handshake...";
                statusDiv.style.display = 'block';

                signInWithPopup(auth, provider)
                    .then((result) => {
                        const user = result.user;
                        
                        loginBtn.style.display = 'none';
                        statusDiv.style.color = '#43d9b8';
                        statusDiv.innerText = `> Access Granted. Welcome, ${user.displayName || user.email}.`;

                        // REDIRECT LOGIC TO THE DASHBOARD
                        setTimeout(() => {
                            window.location.href = "https://project7xbus.com/userdashboard";
                        }, 1500); 
                    })
                    .catch((error) => {
                        console.error("Auth Error:", error);
                        statusDiv.style.color = '#ff3333';
                        statusDiv.innerText = `> Error: ${error.message}`;
                    });
            });
        </script>
	</body>
</html>
